<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gameonz UAE</title>

<style>

body{
    font-family:Arial;
    max-width:500px;
    margin:40px auto;
    padding:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
}

#verifySection{
    display:none;
}

pre{
    background:#f5f5f5;
    padding:10px;
    overflow:auto;
}

</style>

</head>

<body>

<h1>Gameonz UAE</h1>

<p>
Enter your mobile number to receive a PIN.
</p>

<div id="requestSection">

<input
id="msisdn"
placeholder="561234567"
/>

<button onclick="requestPin()">
Request PIN
</button>

</div>

<div id="verifySection">

<input
id="pin"
placeholder="Enter PIN"
/>

<button onclick="verifyPin()">
Verify PIN
</button>

</div>

<pre id="result"></pre>

<script src="lander.js"></script>

</body>
</html>
