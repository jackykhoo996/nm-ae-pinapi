<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gameonz Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

.cards{
    display:flex;
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    min-width:180px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.number{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#222;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.success{
    color:green;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>Gameonz UAE Dashboard</h1>

<div class="cards">

<div class="card">
<div>Total Leads</div>
<div class="number" id="total">0</div>
</div>

<div class="card">
<div>Success</div>
<div class="number" id="success">0</div>
</div>

<div class="card">
<div>Error</div>
<div class="number" id="error">0</div>
</div>

</div>

<table>

<thead>
<tr>
<th>Time</th>
<th>MSISDN</th>
<th>Click ID</th>
<th>Request ID</th>
<th>Status</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

<script>

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_KEY =
"YOUR_ANON_KEY";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadData(){

const { data, error } =
await supabase
.from("leads")
.select("*")
.order("id",{ascending:false})
.limit(100);

if(error){
console.log(error);
return;
}

document.getElementById("total")
.innerText = data.length;

document.getElementById("success")
.innerText =
data.filter(
x => x.status === "SUCCESS"
).length;

document.getElementById("error")
.innerText =
data.filter(
x => x.status === "ERROR"
).length;

const tbody =
document.getElementById(
"tableBody"
);

tbody.innerHTML = "";

data.forEach(row => {

tbody.innerHTML += `

<tr>

<td>
${row.created_at || ""}
</td>

<td>
${row.msisdn || ""}
</td>

<td>
${row.click_id || ""}
</td>

<td>
${row.request_id || ""}
</td>

<td class="${
row.status === "SUCCESS"
? "success"
: "error"
}">
${row.status || ""}
</td>

</tr>

`;

});

}

loadData();

setInterval(
loadData,
5000
);

</script>

</body>
</html>
